inherit_mode:
  merge:
    - Exclude

plugins:
  - rubocop-rake
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - ".git/**/*"
    - "db/**/*"
    - "tmp/**/*"
    - "log/**/*"
    - "vendor/**/*"

Layout/DotPosition:
  EnforcedStyle: trailing

Layout/LineLength:
  Max: 120

Lint/UselessDefaultValueArgument:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "Rakefile"
    - "app.rb"

Metrics/ClassLength:
  Exclude:
    - "app.rb"
    # A catalogue: one card per recovery pathway, as the class itself says.
    # The shape the cop was really pointing at — ten copies of "titled card,
    # paragraph, demonstration" — became Drills::DrillCard, which is the
    # answer weft was already offering. What is left over the limit is the
    # explanatory prose, and on a page whose job is teaching, that prose IS
    # the content. If the cards ever stop sharing a shape, that is the signal
    # worth acting on rather than this line count.
    - "app/pages/drills_page.rb"

Metrics/MethodLength:
  Max: 20

Style/CaseEquality:
  # === is a well-defined tool; knowing your tools beats hiding from them.
  Enabled: false

Style/Documentation:
  Enabled: false

Style/DoubleNegation:
  Enabled: false

Style/ModuleFunction:
  Enabled: false

Style/NumericLiterals:
  Enabled: false

Style/SpecialGlobalVars:
  EnforcedStyle: use_perl_names

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: single_quotes

RSpec/MultipleExpectations:
  Max: 8

RSpec/ExampleLength:
  Max: 15

RSpec/LetSetup:
  Enabled: false
